[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ; A pydantic-settings issue inside the mcp library, not ours, and noisy
    ; enough to bury real output. Nothing we can fix from here.
    ignore::UserWarning:pydantic_settings.*
    ignore:.*IncompleteFieldDefinition.*
    ignore:.*Core Pydantic V1 functionality.*:UserWarning
