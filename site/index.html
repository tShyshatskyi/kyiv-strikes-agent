<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyiv Strike Registry – every place hit, counted once</title>
<meta name="description" content="Every place Russia hit in Kyiv from 1 October to 23 November 2026, read from public reports by three AI agents that group and audit each other's work. Each record links to the words of its sources.">
<meta name="theme-color" content="#F6F4EF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body class="app">
<header class="top" id="top"></header>

<main class="stage">
  <div class="mapwrap">
    <div id="map" role="region" aria-label="Map of places hit"></div>
    <div class="mapfilters" id="filters" aria-label="Filters"></div>
    <div class="badge" id="badge" hidden aria-live="polite"></div>
    <div class="deck">
      <button class="deckbtn prev" id="prev" aria-label="Previous card"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <div class="cards" id="cards" tabindex="0" role="region" aria-label="Places hit. Swipe or use the arrow keys."></div>
      <button class="deckbtn next" id="next" aria-label="Next card"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </div>
  <div class="timeline">
    <button class="btn sm" id="replay"><span class="wide">Replay the autumn</span><span class="narrow">Replay</span></button>
    <div class="strip"><div class="nights" id="nights"></div><div class="ticks" id="ticks"></div></div>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-h">
  <button class="x" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
  <div id="sheet-body"></div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
mountHeader('map');
const R = window.REGISTRY, S = R.sites, $ = s => document.querySelector(s);
const NIGHTS = allNights(R.period), DAY = Object.fromEntries(R.days.map(d => [d.day, d]));
const state = {night: null, w: 'all', t: '', d: ''};
const order = (a, b) => b.day.localeCompare(a.day) || String(a.first).localeCompare(String(b.first));
let list = [], active = -1, ready = false;          // cards: 0 is the overview card, 1..n are places
const syncFilters = mountFilters($('#filters'), S, state, p => set(p));
function set(p) { Object.assign(state, p); render(); }
const visible = skip => S.filter(s => passes(state, s, skip));

// ---------- map
const map = L.map('map', {zoomControl: false, zoomSnap: 0.25, attributionControl: false, renderer: L.canvas({tolerance: 8, padding: .4})});
if (matchMedia('(hover:hover)').matches) L.control.zoom({position: 'topright'}).addTo(map);
L.control.attribution({position: 'topright', prefix: false}).addTo(map);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: 'Tiles © Esri · Districts © OpenStreetMap'}).addTo(map);
L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16}).addTo(map);
const districtLayer = L.geoJSON(R.districts, {style: {color: '#6E6A62', weight: 1, opacity: .55, fill: false}, interactive: false}).addTo(map);
const dots = L.layerGroup().addTo(map), ring = L.layerGroup().addTo(map), marks = {};

// Places known only by district all sit on one point per district; spread them
// in a small spiral around it so each stays visible and tappable.
function spread(items) {
  const at = {};
  return items.map(s => {
    if (s.lat == null) return null;
    if (s.precision === 'building' || s.precision === 'street') return [s.lat, s.lon];
    const k = s.lat.toFixed(4) + s.lon.toFixed(4), i = at[k] = (at[k] ?? -1) + 1;
    if (!i) return [s.lat, s.lon];
    const r = 0.0021 * Math.sqrt(i), a = i * 2.39996;
    return [s.lat + r * Math.sin(a), s.lon + r * Math.cos(a) * 1.55];
  });
}
function drawDots(items) {
  dots.clearLayers(); ring.clearLayers();
  for (const k in marks) delete marks[k];
  spread(items).forEach((ll, i) => {
    const s = items[i]; if (!ll) return;
    const c = COLOR[s.wclass], exact = s.precision === 'building' || s.precision === 'street';
    const m = exact ? L.circleMarker(ll, {radius: 6.5, color: '#F6F4EF', weight: 1.5, fillColor: c, fillOpacity: 1})
                    : L.circleMarker(ll, {radius: 5.5, color: c, weight: 1.6, opacity: .85, fill: true, fillOpacity: .12, fillColor: c});
    m.on('click', () => goTo(list.indexOf(s), {fly: true}));
    marks[s.id] = m; dots.addLayer(m);
  });
}
// Room the cards and filters take over the map, so fitting and panning avoid them.
const pad = () => ({paddingTopLeft: [24, $('#filters').offsetHeight + 28], paddingBottomRight: [24, $('.deck').offsetHeight + 16]});
function fit(items) {
  const pts = items.filter(s => marks[s.id]).map(s => marks[s.id].getLatLng());
  const b = pts.length > 1 ? L.latLngBounds(pts) : districtLayer.getBounds();
  if (!state.night && state.w === 'all' && !state.t && !state.d) b.extend(districtLayer.getBounds());
  // flyTo needs a laid-out map with a view; the first fit (and any failure) jumps instead.
  if (!ready) return map.fitBounds(b, {...pad(), maxZoom: 14});
  try { map.flyToBounds(b, {...pad(), maxZoom: 14, duration: .6}); } catch { map.fitBounds(b, {...pad(), maxZoom: 14}); }
}
new ResizeObserver(() => map.invalidateSize()).observe($('#map'));

// ---------- cards
function overviewCard() {
  const v = list, any = state.w !== 'all' || state.t || state.d;
  if (state.night) {
    const d = DAY[state.night] || {}, c = d.city || {}, a = d.alerts || {drone: 0, missile: 0};
    const i = NIGHTS.indexOf(state.night);
    const bits = [`${v.length} ${pl(v.length, 'place', 'places')}`, c.killed ? `${c.killed} killed` : '', c.injured ? `${c.injured} injured` : '', a.drone + a.missile ? `${hm(a.drone + a.missile)} under alert` : ''].filter(Boolean);
    return `<article class="card over" data-i="0"><p class="when">Attack night${any ? ', filtered' : ''}</p><h2>${fmtDay(state.night, 'dowlong')}</h2>` +
      `<p class="tot tnum">${bits.join(' · ')}</p>${d.summary ? `<p class="sum">${esc(d.summary)}</p>` : '<p class="sum mute">No place recorded this night.</p>'}` +
      `<div class="row3"><button class="chip" data-go="${NIGHTS[i - 1] || ''}"${i ? '' : ' disabled'}>Earlier night</button><button class="chip" data-go="">All nights</button><button class="chip" data-go="${NIGHTS[i + 1] || ''}"${i < NIGHTS.length - 1 ? '' : ' disabled'}>Later night</button></div></article>`;
  }
  const killed = sum(R.days.map(d => d.city?.killed)), injured = sum(R.days.map(d => d.city?.injured));
  return `<article class="card over" data-i="0"><p class="when">1 October – 23 November 2026</p>` +
    `<h2>Every place Russia hit in Kyiv this autumn, counted once.</h2>` +
    (any ? `<p class="tot tnum">${v.length} of ${S.length} places match. <button class="link" onclick="reset()">Clear filters</button></p>`
         : `<p class="tot tnum">${S.length} places · ${killed} killed · ${injured} injured · ${R.workflow.alert_hours} hours under alert</p>`) +
    `<p class="sum">Swipe for every place, newest first, or pick a night below. Read by three AI agents from ${R.workflow.collected.toLocaleString('en')} public posts. <a href="how.html">How it works</a></p>` +
    `<p class="key"><span><i class="dot"></i>exact address</span><span><i class="ring"></i>district only</span></p></article>`;
}
function placeCard(s, i) {
  const meta = [WEAPON[s.weapon] || 'Weapon not stated', cas(s)].filter(Boolean).join(' · ');
  return `<article class="card${s.photo ? ' ph' : ''}" data-i="${i}" style="--c:${COLOR[s.wclass]}">` +
    (s.photo ? `<img src="${s.photo}" alt="" loading="lazy">` : '') +
    `<p class="when">${fmtDay(s.day, 'dow')}${s.time ? ', ' + esc(s.time) : ''}</p><h3>${esc(s.title)}</h3>` +
    `<p class="meta">${esc(where(s))}${s.lat == null ? ' · not on the map' : ''}</p><p class="meta">${esc(meta)}</p>` +
    (s.photo ? '' : `<p class="sum">${esc(s.summary)}</p>`) +
    `<p class="foot"><span class="${s.level === 'confirmed' ? 'ok' : ''}">${LEVEL_SHORT[s.level](s)}</span><button class="link" data-open="${i}">Sources (${s.sources.length})</button></p></article>`;
}
function drawCards() {
  $('#cards').innerHTML = overviewCard() + list.map((s, i) => placeCard(s, i + 1)).join('');
  $('#cards').scrollLeft = 0; active = -1; mark(0);
}
const cardEls = () => $('#cards').children;
function mark(i) {
  if (i === active) return;
  cardEls()[active]?.classList.remove('on'); active = i; cardEls()[i]?.classList.add('on');
  ring.clearLayers();
  const s = list[i - 1], m = s && marks[s.id];
  if (m) { m.bringToFront(); L.circleMarker(m.getLatLng(), {radius: 13, color: '#1C1B19', weight: 2, fill: false, interactive: false}).addTo(ring); }
  $('#prev').disabled = i <= 0; $('#next').disabled = i >= list.length;
}
function settle(i, fly) {
  const s = list[i - 1], m = s && marks[s.id];
  if (i === 0) return fit(list);
  if (!m) return;
  if (fly) map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14), {duration: .6});
  else map.panInside(m.getLatLng(), pad());
}
function goTo(i, {fly = false} = {}) {
  const el = cardEls()[i]; if (!el) return;
  const c = $('#cards');
  c.scrollTo({left: centered() ? el.offsetLeft - (c.clientWidth - el.offsetWidth) / 2 : el.offsetLeft - snapPad(), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  mark(i); settle(i, fly);
}
const centered = () => innerWidth < 900;
const snapPad = () => parseFloat(getComputedStyle($('#cards')).scrollPaddingLeft) || 0;
// Which card is in front: the one nearest the middle (phones) or the left edge (wider screens).
let settleT;
$('#cards').addEventListener('scroll', () => {
  const c = $('#cards'), anchor = centered() ? c.scrollLeft + c.clientWidth / 2 : c.scrollLeft + snapPad() + 1;
  let best = 0, bd = Infinity;
  [...cardEls()].forEach((el, i) => { const d = Math.abs((centered() ? el.offsetLeft + el.offsetWidth / 2 : el.offsetLeft) - anchor); if (d < bd) { bd = d; best = i; } });
  if (best !== active) mark(best);
  clearTimeout(settleT); settleT = setTimeout(() => settle(active, false), 160);
}, {passive: true});
$('#cards').addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $('#cards').scrollLeft += e.deltaY; e.preventDefault(); } }, {passive: false});
$('#cards').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return set({night: g.dataset.go || null});
  const o = e.target.closest('[data-open]'); if (o) return openSheet(list[o.dataset.open - 1]);
  if (e.target.closest('a,button')) return;
  const card = e.target.closest('.card'); if (card) goTo(+card.dataset.i, {fly: true});
});
$('#prev').onclick = () => goTo(Math.max(0, active - 1));
$('#next').onclick = () => goTo(Math.min(list.length, active + 1));
addEventListener('keydown', e => {
  if (e.target.closest('select,input') || $('#sheet').open) return;
  if (e.key === 'ArrowRight') { goTo(Math.min(list.length, active + 1)); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { goTo(Math.max(0, active - 1)); e.preventDefault(); }
});

// ---------- sources sheet
function openSheet(s) {
  $('#sheet-body').innerHTML = (s.photo ? `<img src="${s.photo}" alt="Photo from the official post"><p class="cap">${esc(photoCaption(s))}</p>` : '') +
    `<p class="when">${fmtDay(s.day, 'dowlong')}${s.time ? ', ' + esc(s.time) : ''}</p><h2 id="sheet-h">${esc(s.title)}</h2>` +
    `<p class="meta">${esc(where(s))} · ${WEAPON[s.weapon] || 'Weapon not stated'}${cas(s) ? ' · ' + cas(s) : ''}</p>` +
    `<p>${esc(s.summary)}</p><p class="meta">${LEVEL[s.level]}${s.level === 'confirmed' ? ` (${s.voices})` : ''}</p>` +
    (s.flags.length ? `<p class="flag">Auditor's note: ${esc(s.flags.join(' '))}</p>` : '') +
    `<h3>What the sources said</h3>${sourcesHTML(s)}<p class="meta"><a href="records.html#${s.id}">Open in the records</a></p>`;
  $('#sheet').showModal(); $('#sheet').scrollTop = 0;
}

// ---------- timeline
function drawStrip() {
  $('#nights').innerHTML = nightStrip(visible('night'), R, NIGHTS, state.night, 72, 22);
  $('#ticks').innerHTML = nightTicks(NIGHTS);
}
$('#nights').addEventListener('click', e => { const r = e.target.closest('[data-d]'); if (r) set({night: state.night === r.dataset.d ? null : r.dataset.d}); });

// ---------- render
function render() {
  syncFilters();
  list = visible().sort(order);
  drawDots(list); drawCards(); drawStrip(); fit(list);
  history.replaceState(null, '', state.night ? '#night=' + state.night : location.pathname);
}
window.reset = () => set({night: null, w: 'all', t: '', d: ''});

// Links from the other pages: #night=YYYY-MM-DD or #site=ID.
(function start() {
  const h = new URLSearchParams(location.hash.slice(1));
  const s = h.get('site') && S.find(x => x.id === h.get('site'));
  if (s) state.night = s.day; else if (NIGHTS.includes(h.get('night'))) state.night = h.get('night');
  map.fitBounds(districtLayer.getBounds(), pad());
  render(); ready = true;
  if (s) setTimeout(() => goTo(list.indexOf(s) + 1, {fly: true}), 300);
})();

// ---------- replay: the autumn night by night
let playing = null;
const REPLAY = $('#replay').innerHTML;
function stopReplay() { clearInterval(playing); playing = null; $('#replay').innerHTML = REPLAY; $('#badge').hidden = true; $('.deck').classList.remove('away'); render(); }
$('#replay').onclick = () => {
  if (playing) return stopReplay();
  const base = visible('night'); let i = 0;
  $('#replay').textContent = 'Stop'; $('.deck').classList.add('away'); $('#badge').hidden = false;
  clearTimeout(settleT);
  map.fitBounds(districtLayer.getBounds(), {paddingTopLeft: [24, $('#filters').offsetHeight + 28], paddingBottomRight: [24, 110]});
  playing = setInterval(() => {
    const upto = NIGHTS[i], sofar = base.filter(s => s.day <= upto), tonight = base.filter(s => s.day === upto);
    drawDots(sofar);
    $('#nights').innerHTML = nightStrip(base, R, NIGHTS, upto, 72, 22);
    $('#badge').innerHTML = `<b>${fmtDay(upto, 'dowlong')}</b>${tonight.length} tonight · ${sofar.length} so far`;
    if (++i >= NIGHTS.length) { clearInterval(playing); setTimeout(stopReplay, 1400); }
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 40 : 190);
};
</script>
</body>
</html>
