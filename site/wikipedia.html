<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checked against Wikipedia – Kyiv Strike Registry</title>
<meta name="description" content="Every attack on Kyiv that Wikipedia editors recorded in autumn 2026, set against what the registry found on that date.">
<meta name="theme-color" content="#F6F4EF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="top"></header>
<main>
<section class="pagehead"><div class="wrap">
  <h1>Checked against Wikipedia</h1>
  <p class="lede" id="wiki-lede"></p>
  <p class="lede small mute" id="wiki-src"></p>
  <div class="wiki" id="wiki"></div>
</div></section>
</main>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
mountHeader('wiki'); mountFooter();
const R = window.REGISTRY, $ = s => document.querySelector(s);
const W = R.wiki, sm = W.summary;
const VERDICT = {match: 'Agrees', differs: 'Differs', no_figure: 'Nothing to compare',
                 missing: 'Not in the registry', pending: 'Not processed yet'};

$('#wiki-lede').innerHTML = `Wikipedia retells the same news, so it can never confirm a place on its own. ` +
  `What it can do is say whether the registry missed an attack, missed a kind of place, or has a different death toll — ` +
  `but only if the comparison is fixed in advance and allowed to fail. ` +
  `Editors of ${W.articles.length} articles in English and Ukrainian recorded attacks on Kyiv on ${sm.dates} dates in this period. ` +
  `<b>${sm.match} agree, ${sm.differs} differ, ${sm.no_figure} have no death toll on one side, ${sm.missing} are missing from the registry altogether.</b>` +
  (sm.pending ? ` ${sm.pending} more have not been read yet.` : '');
$('#wiki-src').innerHTML = `${W.window_note} An entry that names a bridge is not satisfied by a night of burning cars: ` +
  `the kinds of place it names are checked too. Read on ${W.taken} from: ` +
  W.articles.map(a => `<a href="https://${a.lang}.wikipedia.org/w/index.php?oldid=${a.revid}" target="_blank" rel="noopener">${esc(a.title)}</a>`).join('; ') + '.';

const tidy = t => t.replace(/^[^:]*?\d{4}[,:]\s*/, '').replace(/^Київ\. /, '').replace(/Засіб: —\. /, '')
  .replace(/^Засіб: ([^.]+)\. (.)/, (m, w, c) => w[0].toUpperCase() + w.slice(1) + '; ' + c);
$('#wiki').innerHTML = Object.entries(W.dates).sort((a, b) => b[0].localeCompare(a[0])).map(([d, n]) =>
  `<div class="wrow"><time>${fmtDay(d, 'dow')}<br>` +
    n.nights.map(nd => `<a class="go" href="./#night=${nd}">${fmtDay(nd)}</a>`).join(' · ') + `</time>` +
  `<div class="says">${n.records.map(r => `<div lang="${r.lang}">${esc(tidy(r.text))} <a href="${r.url}" target="_blank" rel="noopener">${r.lang}.wikipedia</a></div>`).join('')}` +
    (n.named.length ? `<div class="mute">Names: ${esc(n.named.join(', '))}</div>` : '') + `</div>` +
  `<div><span class="v ${n.verdict}">${VERDICT[n.verdict]}</span><br><span class="mute">${esc(n.detail)}</span></div></div>`).join('');
</script>
</body>
</html>
